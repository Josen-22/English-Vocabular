name: Windows installer release

on:
  push:
    branches: [v2-themes]
    paths: [installer/release-version.txt]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Build and test application and installer
        shell: pwsh
        run: ./tools/build-release.ps1
      - name: Publish installer and portable archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content installer/release-version.txt -Raw).Trim()
          if ($version -ne '2.1.0') { throw 'Release version does not match this build.' }
          $assets = @("release/EnglishVocabular-$version-Setup-x64.exe",
                      "release/EnglishVocabular-$version-Portable-x64.zip",
                      'release/SHA256SUMS.txt', 'release/README.txt')
          gh release view "v$version" --json id 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v$version" @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw '更新发布附件失败。' }
            gh release edit "v$version" --notes-file docs/release-notes-2.1.0.md
            if ($LASTEXITCODE -ne 0) { throw '更新发布说明失败。' }
            # GitHub normalizes an all-Chinese attachment filename to default.txt.
            $oldNames = gh release view "v$version" --json assets --jq '.assets[].name'
            if ($oldNames -contains 'default.txt') {
              gh release delete-asset "v$version" default.txt --yes
              if ($LASTEXITCODE -ne 0) { throw '清理旧说明附件失败。' }
            }
          } else {
            gh release create "v$version" @assets --target $env:GITHUB_SHA `
              --title "本地单词本 $version · 每日词卡" `
              --notes-file docs/release-notes-2.1.0.md --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release 发布失败。' }
